<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | PENTRA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Space+Grotesk:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- الجهة اليمين: بوكس تسجيل الدخول -->
    <section class="login-card">
      <img class="logo" src="images/الشعاربدون نصوص.png" alt="شعار بنترا">

      <h1 class="welcome">
        <span class="welcome-ar">مرحباً بك في</span>
        <span class="welcome-brand">PENTRA</span>
      </h1>
      <p class="subtitle">سجل دخولك لمتابعة رحلتك التعليمية</p>

      <form class="login-form" id="loginForm" novalidate>

        <label class="field-label" for="email">البريد الالكتروني</label>
        <div class="input-wrap">
  <input class="input input-end" type="email" id="email" placeholder="أدخل البريد الالكتروني" autocomplete="email">
 <svg class="icon icon-end" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D0D2D6" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
  <rect x="3" y="7" width="18" height="12" rx="2"/>
  <path d="M3 7l9 7 9-7"/>
  <path d="M3 19l6-6"/>
  <path d="M21 19l-6-6"/>
</svg>
</div>

        <label class="field-label" for="password">كلمة المرور</label>
        <div class="input-wrap">
          <input class="input input-end" type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
          <button class="eye" type="button" id="togglePassword" aria-label="إظهار كلمة المرور">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#CECFD2" fill-rule="evenodd">
              <path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </button>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="remember">
            <span>تذكرني</span>
          </label>
          <a href="#" class="link">نسيت كلمة المرور ؟</a>
        </div>

        <button type="submit" class="btn-login">
          <span>تسجيل الدخول</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="M11 6l-6 6 6 6"/>
          </svg>
        </button>

        <div class="divider">
          <span class="line"></span>
          <span class="or">أو</span>
          <span class="line"></span>
        </div>

        <button type="button" class="btn-google">
  <span>تسجيل الدخول باستخدام Google</span>
  <svg width="24" height="24" viewBox="0 0 48 48">
            <path fill="#E33629" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#587DBD" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#F8BD00" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#319F43" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
         
        </button>

        <p class="signup">
          <span>ليس لديك حساب ؟</span>
          <a href="#" class="link">إنشاء حساب جديد</a>
        </p>
      </form>
    </section>

    <!-- الجهة اليسار: النص + الكاروسيل -->
    <section class="hero">
      <h2 class="hero-title">
        <span class="t48">اكتشف مهارتك</span>
        <span><span class="t48">وابدأ</span> <span class="t64 grad">رحلتك التعليمية</span></span>
      </h2>
      <p class="hero-text">في بنترا نساعدك على تحديد مستواك , واختيار المسار التعليمي الأنسب لك لتحقق أهدافك بثقة .</p>

      <div class="stage" id="carousel">
        <img class="slide s1 active" src="images/3D-Blocks.png" alt="">
        <img class="slide s2" src="images/Laptop.png" alt="">
        <img class="slide s3" src="images/3D-Books.png" alt="">
      </div>

      <div class="dots" id="dots">
        <button class="dot active" aria-label="الشريحة 1"></button>
        <button class="dot" aria-label="الشريحة 2"></button>
        <button class="dot" aria-label="الشريحة 3"></button>
      </div>
    </section>

  </main>

  <script src="main.js"></script>
</body>
</html>
